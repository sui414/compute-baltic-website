const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(){
  const pw = document.getElementById('pw').value;
  const err = document.getElementById('err');
  if(!window.crypto || !crypto.subtle){
    err.textContent = 'This page needs a secure (https) connection to decrypt.';
    return;
  }
  err.textContent = 'deriving key… (a few seconds — the key derivation is slow by design)';
  const want = location.hash;
  try{
    const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      {name:'PBKDF2', salt:b64(ENC.salt), iterations:ENC.iters, hash:'SHA-256'},
      km, {name:'AES-GCM', length:256}, false, ['decrypt']);
    const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(ENC.nonce)}, key, b64(ENC.ct));
    const html = new TextDecoder().decode(pt);
    document.open(); document.write(html); document.close();
    if(want){
      history.replaceState(null, '', want);
      setTimeout(function(){
        var t=document.querySelector('.tab[data-t="'+want.replace('#tab-','')+'"]');
        if(t){ t.click(); t.focus(); }
      }, 60);
    }
  }catch(e){
    err.textContent = (e && e.name === 'OperationError')
      ? 'That passphrase did not work.'
      : 'Could not decrypt in this browser — try Chrome, Safari or Firefox over https.';
    console.error(e);
