async function unlock(){
  const pw = document.getElementById('pw').value;
  const err = document.getElementById('err'); err.textContent = 'deriving key…';
  try{
    const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      {name:'PBKDF2', salt:b64(ENC.salt), iterations:ENC.iters, hash:'SHA-256'},
      km, {name:'AES-GCM', length:256}, false, ['decrypt']);
    const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(ENC.nonce)}, key, b64(ENC.ct));
    const html = new TextDecoder().decode(pt);
    document.open(); document.write(html); document.close();
  }catch(e){ err.textContent = 'wrong passphrase'; }
}
document.getElementById('pw').addEventListener('keydown', e => { if(e.key==='Enter') unlock(); });
