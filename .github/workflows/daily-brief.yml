name: daily-brief
# Personal Telegram brief — reads the ORG data repo (canonical since 2026-09-17).
on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:
concurrency:
  group: daily-brief
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: prepare
        run: |
          printf '%s\n' "${{ secrets.ORG_DATA_KEY }}" > "$RUNNER_TEMP/dk"
          chmod 600 "$RUNNER_TEMP/dk"
      - name: run
        env:
          GIT_SSH_COMMAND: ssh -i ${{ runner.temp }}/dk -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          git clone --depth 5 git@github.com:PanteraCapital/compute-baltic-data.git "$RUNNER_TEMP/w"
          cd "$RUNNER_TEMP/w" && bash ops/t.sh
